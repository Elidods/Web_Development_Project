<!-- A stylized, hand drawn style map rather than a real embedded map
     service, showing roughly where the roastery sits relative to the
     river and the high street, used on the contact page -->
<svg viewBox="0 0 480 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mapTitle">
  <title id="mapTitle">Simplified map showing the roastery near the river and high street</title>

  <rect x="0" y="0" width="480" height="320" fill="#f5efe4" />

  <!-- river -->
  <path d="M-10 60 C 100 90, 140 40, 240 70 C 340 100, 380 60, 490 90"
        fill="none" stroke="#9db3c8" stroke-width="18" opacity="0.6" />

  <!-- streets -->
  <line x1="60" y1="0" x2="60" y2="320" stroke="#ded4c2" stroke-width="10" />
  <line x1="0" y1="220" x2="480" y2="200" stroke="#ded4c2" stroke-width="10" />
  <line x1="300" y1="0" x2="330" y2="320" stroke="#ded4c2" stroke-width="10" />

  <text x="66" y="30" font-family="Space Mono, monospace" font-size="13" fill="#7a6f62">High Street</text>
  <text x="340" y="40" font-family="Space Mono, monospace" font-size="13" fill="#7a6f62">Mill Road</text>
  <text x="20" y="240" font-family="Space Mono, monospace" font-size="13" fill="#7a6f62">Foundry Lane</text>

  <!-- roastery marker -->
  <circle cx="215" cy="212" r="10" fill="#b54e2c" />
  <path d="M215 202 L215 176" stroke="#b54e2c" stroke-width="3" />
  <circle cx="215" cy="170" r="8" fill="none" stroke="#b54e2c" stroke-width="3" />

  <rect x="150" y="230" width="130" height="34" rx="6" fill="#211d1a" />
  <text x="163" y="252" font-family="Fraunces, serif" font-size="15" fill="#f5efe4">Marrow &amp; Ember</text>
</svg>
